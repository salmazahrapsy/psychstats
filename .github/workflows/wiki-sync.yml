name: Release Evidence Dispatcher

on:
  release:
    types: [ published ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Testing, Schema Verification & Quality Gate
  # -------------------------------------------------------------
  test-and-validate:
    name: "Stage 1: Validation & Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 pyyaml

      - name: Validate Dublin Core & Schema.org JSON-LD
        run: |
          python pipelines/schema_validator.py

      - name: Execute Pytest Test Suites
        run: |
          python -m pytest tests/ -v

  # -------------------------------------------------------------
  # STAGE 2: Multi-Platform Evidence Synchronization
  # -------------------------------------------------------------
  dispatch-evidence-release:
    name: "Stage 2: Multi-Platform Evidence Publishing"
    needs: test-and-validate
    if: github.event_name == 'release' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install synchronization dependencies
        run: |
          pip install -r requirements.txt
          pip install kaggle qdrant-client neo4j pyyaml

      - name: Execute Cross-Platform Synchronization
        env:
          MIRAHEZE_BOT_USER: ${{ secrets.MIRAHEZE_BOT_USER }}
          MIRAHEZE_BOT_PASS: ${{ secrets.MIRAHEZE_BOT_PASS }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python src/sync_evidence.py
