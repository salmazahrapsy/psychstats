name: Ecosystem CI/CD & Multi-Platform Sync

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  # Stage 1: Quality Gate & Validation
  test-and-validate:
    name: "Stage 1: Validation & Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 pyyaml

      - name: Run Schema Validator
        run: |
          python pipelines/schema_validator.py

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

  # Stage 2: Multi-Platform Publishing (Protected against external service timeouts)
  sync-ecosystem:
    name: "Stage 2: Multi-Platform Publishing"
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install publishing packages
        run: |
          pip install -r requirements.txt
          pip install kaggle qdrant-client neo4j pyyaml

      - name: Sync PsychStats Wiki
        continue-on-error: true
        env:
          MIRAHEZE_BOT_USER: ${{ secrets.MIRAHEZE_BOT_USER }}
          MIRAHEZE_BOT_PASS: ${{ secrets.MIRAHEZE_BOT_PASS }}
        run: |
          if [ -n "$MIRAHEZE_BOT_USER" ] && [ -n "$MIRAHEZE_BOT_PASS" ]; then
            python src/utils/sync_to_wiki.py --page "Research_Methods/Benchmark_Metrics"
          else
            echo "Notice: MIRAHEZE credentials not set in GitHub Secrets. Skipping."
          fi

      - name: Sync Kaggle Datasets
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            mkdir -p ~/.kaggle
            echo "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
            echo "✓ Kaggle authenticated for evidence release."
          else
            echo "Notice: KAGGLE_API_TOKEN secret not set. Skipping."
          fi

      - name: Index Qdrant Vectors
        continue-on-error: true
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          if [ -n "$QDRANT_API_KEY" ]; then
            echo "✓ Qdrant API key loaded."
          else
            echo "Notice: QDRANT_API_KEY secret not set. Skipping."
          fi

      - name: Sync Neo4j Knowledge Graph
        continue-on-error: true
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          if [ -n "$NEO4J_PASSWORD" ]; then
            echo "✓ Neo4j password loaded."
          else
            echo "Notice: NEO4J_PASSWORD secret not set. Skipping."
          fi
